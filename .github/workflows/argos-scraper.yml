name: Argos Quarterly Scraper

on:
  schedule:
    - cron: '0 8 1 2,5,8,11 *'   # First attempt on publication month
    - cron: '0 8 2-28 2,5,8,11 *' # Retry daily for rest of month
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check if already have latest quarter
        id: check
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os
          from datetime import date

          # Calculate which quarter we expect
          today = date.today()
          month = today.month
          year = today.year
          q = (month - 1) // 3
          if q == 0:
              q = 4
              year -= 1
          expected = f"Q{q} {year}"
          print(f"Expected quarter: {expected}")

          # Check if already in Supabase
          url = "https://djexnxctayzbsgljothn.supabase.co/rest/v1/argos_index?quarter=eq." + expected.replace(" ", "%20") + "&select=quarter"
          req = urllib.request.Request(url, headers={
              'apikey': os.environ['SUPABASE_KEY'],
              'Authorization': 'Bearer ' + os.environ['SUPABASE_KEY']
          })
          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())
          
          if data:
              print(f"{expected} already in database — skipping")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("skip=true\n")
          else:
              print(f"{expected} not in database — will scrape")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("skip=false\n")
          PYEOF
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch Argos page and extract EV/EBITDA
        id: scrape
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import re
          import os
          from datetime import date

          def get_quarter_url(q, year):
              ordinals = {1: '1st', 2: '2nd', 3: '3rd', 4: '4th'}
              return f"https://argos.fund/argos-index-{ordinals[q]}-quarter-{year}/"

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except:
                  return ''

          # Try last 4 quarters until we find a published one
          today = date.today()
          month = today.month
          year = today.year
          q = (month - 1) // 3
          if q == 0:
              q = 4
              year -= 1

          page = ''
          quarter = ''
          for _ in range(4):
              url = get_quarter_url(q, year)
              print(f"Trying: {url}")
              page = fetch(url)
              if page and 'noindex' not in page and 'Page non trouvée' not in page:
                  quarter = f"Q{q} {year}"
                  print(f"Found: {quarter}")
                  break
              q -= 1
              if q == 0:
                  q = 4
                  year -= 1

          if not quarter:
              print("Not published yet — will retry tomorrow")
              exit(1)

          match = re.search(r'(\d+\.\d)x\s*EBITDA|EBITDA[^0-9]*(\d+\.\d)x', page, re.IGNORECASE)
          if not match:
              match = re.search(r'(\d+\.\d)x', page)

          ebitda = None
          if match:
              ebitda = match.group(1) if match.group(1) else match.group(2) if len(match.groups()) > 1 else None

          if not ebitda:
              print("Could not extract EBITDA — will retry tomorrow")
              exit(1)

          print(f"Extracted: {ebitda}x for {quarter}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ebitda={ebitda}\n")
              f.write(f"quarter={quarter}\n")
          PYEOF

      - name: Insert into Supabase
        if: steps.check.outputs.skip != 'true' && steps.scrape.outputs.ebitda != ''
        run: |
          curl -s -X POST \
            "https://djexnxctayzbsgljothn.supabase.co/rest/v1/argos_index" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=ignore-duplicates" \
            -d "{\"quarter\": \"${{ steps.scrape.outputs.quarter }}\", \"ebitda_mid\": ${{ steps.scrape.outputs.ebitda }}, \"source\": \"github-action\"}"
          echo "Done"
