name: Argos Quarterly Scraper

on:
  schedule:
    - cron: '0 8 1 2,5,8,11 *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Argos page and extract EV/EBITDA
        id: scrape
        run: |
          # Calculate previous quarter
          MONTH=$(date +%-m)
          YEAR=$(date +%Y)
          PREV_MONTH=$((MONTH - 3))
          PREV_YEAR=$YEAR
          if [ $PREV_MONTH -le 0 ]; then PREV_MONTH=$((PREV_MONTH + 12)); PREV_YEAR=$((YEAR - 1)); fi
          Q=$(( (PREV_MONTH - 1) / 3 + 1 ))
          case $Q in
            1) ORDINAL="1st" ;;
            2) ORDINAL="2nd" ;;
            3) ORDINAL="3rd" ;;
            4) ORDINAL="4th" ;;
          esac
          QUARTER="Q${Q} ${PREV_YEAR}"
          URL="https://argos.fund/argos-index-${ORDINAL}-quarter-${PREV_YEAR}/"
          echo "Trying: $URL"
          PAGE=$(curl -s -L -A "Mozilla/5.0" "$URL")

          # If not found, go one quarter further back
          if echo "$PAGE" | grep -qE "Page non trouvée|not found|404|noindex"; then
            echo "Not published yet, trying one quarter back"
            Q=$((Q - 1))
