name: Argos Quarterly Scraper

on:
  schedule:
    - cron: '0 8 1 2,5,8,11 *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Argos page and extract EV/EBITDA
        id: scrape
        run: |
          URL="https://argos.fund/argos-index-4th-quarter-2025/"
          QUARTER="Q4 2025"
          
          echo "Fetching: $URL"
          PAGE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$URL")
          
          echo "=== PAGE PREVIEW ==="
          echo "$PAGE" | head -c 2000
          echo "=== END PREVIEW ==="
          
          EBITDA=$(echo "$PAGE" | grep -oi '[0-9]\+\.[0-9]x[ ]*EBITDA\|EBITDA[^0-9]*[0-9]\+\.[0-9]x' | grep -oi '[0-9]\+\.[0-9]' | head -1)
          
          if [ -z "$EBITDA" ]; then
            EBITDA=$(echo "$PAGE" | grep -oi '[0-9]\+\.[0-9]x' | grep -oi '[0-9]\+\.[0-9]' | head -1)
          fi
          
          echo "Extracted EBITDA: $EBITDA"
          
          if [ -z "$EBITDA" ]; then
            echo "Could not extract figure"
            exit 1
          fi
          
          echo "ebitda=$EBITDA" >> $GITHUB_OUTPUT
          echo "quarter=$QUARTER" >> $GITHUB_OUTPUT

      - name: Insert into Supabase
        run: |
          curl -s -X POST \
            "https://djexnxctayzbsgljothn.supabase.co/rest/v1/argos_index" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=ignore-duplicates" \
            -d "{\"quarter\": \"${{ steps.scrape.outputs.quarter }}\", \"ebitda_mid\": ${{ steps.scrape.outputs.ebitda }}, \"source\": \"github-action\"}"
          echo "Done"
