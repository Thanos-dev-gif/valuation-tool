name: Argos Quarterly Scraper

on:
  schedule:
    - cron: '0 8 1 2,5,8,11 *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Argos page and extract EV/EBITDA
        id: scrape
        run: |
          PAGE=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://www.argos-wityu.com/en/argos-index/")
          
          # Print first 3000 chars so we can see the page structure
          echo "=== PAGE PREVIEW ==="
          echo "$PAGE" | head -c 3000
          echo "=== END PREVIEW ==="
          
          # Try multiple patterns
          echo "=== SEARCHING FOR NUMBERS ==="
          echo "$PAGE" | grep -oi '[0-9]\{1,2\}\.[0-9]x' | head -20
          echo "=== END NUMBERS ==="
