name: Argos Quarterly Scraper

on:
  schedule:
    - cron: '0 8 1 2,5,8,11 *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Argos page and extract EV/EBITDA
        id: scrape
        run: |
          URL="https://www.google.com"
          PAGE=$(curl -s -L -A "Mozilla/5.0" "$URL")
          echo "=== PAGE PREVIEW ==="
          echo "$PAGE" | head -c 3000
          echo "=== END PREVIEW ==="
          echo "=== SEARCHING FOR NUMBERS ==="
          echo "$PAGE" | grep -oi '[0-9][0-9]*\.[0-9]x' | head -20
          echo "=== END NUMBERS ==="
