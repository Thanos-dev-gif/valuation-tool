name: Argos Quarterly Scraper

on:
  schedule:
    - cron: '0 8 1 2,5,8,11 *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Argos page and extract EV/EBITDA
        id: scrape
        run: |
          # Fetch the Argos index page
          PAGE=$(curl -s -A "Mozilla/5.0" "https://www.argos-wityu.com/en/argos-index/")
          
          # Extract EV/EBITDA figure (matches patterns like "12.3x" near "index" or "ebitda")
          EBITDA=$(echo "$PAGE" | grep -oiP '(?:index|ebitda|stood at|multiple)[^.]*?(\d{1,2}\.\d)x' | grep -oP '\d{1,2}\.\d' | head -1)
          
          if [ -z "$EBITDA" ]; then
            echo "Could not extract figure"
            exit 1
          fi
          
          echo "ebitda=$EBITDA" >> $GITHUB_OUTPUT
          
          # Calculate current quarter
          MONTH=$(date +%-m)
          YEAR=$(date +%Y)
          PREV_MONTH=$((MONTH - 3))
          PREV_YEAR=$YEAR
          if [ $PREV_MONTH -le 0 ]; then PREV_MONTH=$((PREV_MONTH + 12)); PREV_YEAR=$((YEAR - 1)); fi
          Q=$(( (PREV_MONTH - 1) / 3 + 1 ))
          QUARTER="Q${Q} ${PREV_YEAR}"
          echo "quarter=$QUARTER" >> $GITHUB_OUTPUT

      - name: Insert into Supabase
        run: |
          curl -X POST \
            'https://djexnxctayzbsgljothn.supabase.co/rest/v1/argos_index' \
            -H 'apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=ignore-duplicates' \
            -d '{
              "quarter": "${{ steps.scrape.outputs.quarter }}",
              "ebitda_mid": ${{ steps.scrape.outputs.ebitda }},
              "source": "github-action"
            }'
